name: Check project

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install 7-Zip
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Extract encrypted ZIP
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          mkdir -p project
          7z x KB-PRO-TV-Encrypted.zip \
            -oproject \
            -p"$ZIP_PASSWORD" \
            -y

      - name: Verify project
        run: |
          test -f project/deno.json
          test -f project/src/main.ts

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Check project
        working-directory: project
        run: deno task check
