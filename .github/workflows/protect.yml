name: Build encrypted source ZIP
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "deploy/**", "deno.json", "README*", ".gitignore"]
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check ZIP password
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: test -n "$ZIP_PASSWORD" || (echo "Create ZIP_PASSWORD in Actions secrets"; exit 1)
      - name: Create AES-256 archive
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          mkdir package
          cp -r src deploy .github deno.json .gitignore README.md README-BN.txt package/
          cd package
          7z a -tzip -mem=AES256 -p"$ZIP_PASSWORD" ../KB-PRO-TV-Encrypted.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: KB-PRO-TV-Encrypted
          path: KB-PRO-TV-Encrypted.zip
          retention-days: 7
