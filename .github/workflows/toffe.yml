name: TOFFE AUTO BOT

on:
  workflow_dispatch:
  schedule:
    - cron: "35 * * * *"
  push:
    branches: [main]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyzipper requests

      - name: Extract PRO_OTT_BD.py
        env:
          BD_OTT_ZIP_PASS: ${{ secrets.BD_OTT_ZIP_PASS }}
        run: |
          python - <<'PY'
          import os, sys
          import pyzipper
          from pathlib import Path

          archive = Path("PRO_OTT_BD.zip")
          raw = os.environ.get("BD_OTT_ZIP_PASS", "")
          if not raw:
              sys.exit("BD_OTT_ZIP_PASS secret is missing/empty.")
          if not archive.exists():
              sys.exit("PRO_OTT_BD.zip not found.")

          password = raw.strip().encode("utf-8")

          with pyzipper.AESZipFile(archive, "r") as z:
              z.setpassword(password)
              files = z.namelist()
              print("ZIP contents:", files)

              target = next(
                  (n for n in files if Path(n).name == "PRO_OTT_BD.py"),
                  None,
              )
              if target is None:
                  sys.exit("PRO_OTT_BD.py not found inside ZIP!")

              try:
                  content = z.read(target)
              except RuntimeError as e:
                  sys.exit(f"Decryption failed: {e}")

          Path("PRO_OTT_BD.py").write_bytes(content)
          print(f"Extracted PRO_OTT_BD.py ({len(content)} bytes)")
          PY

      - name: Verify Python File
        run: |
          test -s PRO_OTT_BD.py
          python -m py_compile PRO_OTT_BD.py
          echo "PRO_OTT_BD.py is ready!"

      - name: Run TOFFE AUTO BOT
        env:
          BD_OTT_ZIP_PASS: ${{ secrets.BD_OTT_ZIP_PASS }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY:  ${{ secrets.HTTPS_PROXY }}
        run: |
          python -u PRO_OTT_BD.py 2>&1 | tee run.log

      - name: Diagnose output
        if: always()
        run: |
          echo "===== ls -la Toffe/ ====="
          ls -la Toffe/ || echo "Toffe/ folder DOES NOT EXIST"
          echo "===== kb.m3u head ====="
          head -n 20 Toffe/kb.m3u || echo "kb.m3u NOT FOUND"
          echo "===== line count ====="
          wc -l Toffe/kb.m3u || true
          echo "===== channel count ====="
          grep -c "^#EXTINF" Toffe/kb.m3u || echo "no channels"

      - name: Upload M3U artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toffee-m3u
          path: Toffe/kb.m3u
          if-no-files-found: warn

      - name: Commit and push kb.m3u
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p Toffe
          git add -A Toffe/
          git diff --cached --quiet && echo "No changes to commit." && exit 0
          git commit -m "chore: update Toffe/kb.m3u [skip ci]"
          git push
