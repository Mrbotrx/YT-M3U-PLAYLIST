name: TOFFE_PRO

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: TOFFE_PRO
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract PRO_OTT_BD.py
        env:
          BD_OTT_ZIP_PASS: ${{ secrets.BD_OTT_ZIP_PASS }}
        run: |
          python - <<'PY'
          import os
          import pyzipper
          import zipfile
          from pathlib import Path

          archive = Path("PRO_OTT_BD.zip")
          password = os.environ.get("BD_OTT_ZIP_PASS", "KBIPTV")

          if not archive.exists():
              raise FileNotFoundError("PRO_OTT_BD.zip not found!")

          extracted = False

          try:
              with pyzipper.AESZipFile(archive) as z:
                  z.setpassword(password.encode())
                  names = z.namelist()

                  target = next(
                      (n for n in names
                       if Path(n).name == "PRO_OTT_BD.py"),
                      None
                  )

                  if not target:
                      raise FileNotFoundError(
                          "PRO_OTT_BD.py not found inside ZIP!"
                      )

                  content = z.read(target)

                  Path("PRO_OTT_BD.py").write_bytes(content)
                  extracted = True

          except Exception as aes_error:
              print("AES extraction failed:", aes_error)

          if not extracted:
              with zipfile.ZipFile(archive) as z:
                  names = z.namelist()

                  target = next(
                      (n for n in names
                       if Path(n).name == "PRO_OTT_BD.py"),
                      None
                  )

                  if not target:
                      raise FileNotFoundError(
                          "PRO_OTT_BD.py not found in ZIP!"
                      )

                  content = z.read(
                      target,
                      pwd=password.encode()
                  )

                  Path("PRO_OTT_BD.py").write_bytes(content)

          print("Successfully extracted PRO_OTT_BD.py")
          PY

      - name: Verify Main File
        run: |
          ls -lh PRO_OTT_BD.py
          python -m py_compile PRO_OTT_BD.py

      - name: Check Update Interval
        id: interval
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path

          state = Path(".last_update")

          try:
              last = float(state.read_text().strip())
          except (OSError, ValueError):
              last = 0

          due = time.time() - last >= 2700

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"due={str(due).lower()}\n")

          print("Update required:", due)
          PY

      - name: Generate Toffee Playlist
        if: steps.interval.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -u PRO_OTT_BD.py

      - name: Save Update Time
        if: steps.interval.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          date +%s > .last_update

      - name: Commit Playlist
        if: steps.interval.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Toffe/kb.m3u .last_update

          if ! git diff --cached --quiet; then
            git commit -m "TOFFE_PRO Automatic Update"
            git push
          else
            echo "No changes detected."
          fi

      - name: Workflow Summary
        if: always()
        run: |
          echo "## TOFFE_PRO" >> $GITHUB_STEP_SUMMARY
          echo "Output: Toffe/kb.m3u" >> $GITHUB_STEP_SUMMARY
          echo "Update Interval: 45 Minutes" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
