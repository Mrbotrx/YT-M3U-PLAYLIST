name: TOFFE_PRO

on:
  workflow_dispatch:

  schedule:
    # Check every 15 minutes
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: TOFFE_PRO
  cancel-in-progress: false

jobs:
  update:
    name: Update Toffee Playlist
    runs-on: ubuntu-latest

    steps:
      # Checkout repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Install dependencies
      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Check 45 minute interval
      - name: Check Update Interval
        id: interval
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path

          state = Path(".last_update")
          now = time.time()

          try:
              last = float(state.read_text().strip())
          except (OSError, ValueError):
              last = 0

          due = (now - last) >= 2700

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"due={str(due).lower()}\n")

          print("Update due:", due)
          PY

      # Generate M3U Playlist
      - name: Generate Toffee M3U
        if: steps.interval.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python PRO_OTT_BD.py

      # Save update timestamp
      - name: Save Update Time
        if: steps.interval.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          date +%s > .last_update

      # Commit playlist
      - name: Push Updated Playlist
        if: steps.interval.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Toffe/kb.m3u .last_update

          if ! git diff --cached --quiet; then
            git commit -m "TOFFE_PRO: Automatic Playlist Update"
            git push
          else
            echo "No changes detected."
          fi

      # Workflow summary
      - name: Update Summary
        if: always()
        run: |
          echo "## TOFFE_PRO Update" >> $GITHUB_STEP_SUMMARY
          echo "- Output: Toffe/kb.m3u" >> $GITHUB_STEP_SUMMARY
          echo "- Schedule: Every 45 minutes (checked every 15 minutes)" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
