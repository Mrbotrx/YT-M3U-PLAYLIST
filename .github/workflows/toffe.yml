- name: KB.bot
        env:
          BD_OTT_ZIP_PASS: ${{ secrets.BD_OTT_ZIP_PASS }}
        run: |
          python - <<'PY'
          import os
          import pyzipper
          from pathlib import Path

          archive = Path("PRO_OTT_BD.zip")
          password = os.environ.get("BD_OTT_ZIP_PASS")

          if not password:
              raise RuntimeError(
                  "BD_OTT_ZIP_PASS GitHub Secret is missing!"
              )

          if not archive.exists():
              raise FileNotFoundError("PRO_OTT_BD.zip not found!")

          with pyzipper.AESZipFile(archive, "r") as z:
              z.setpassword(password.encode("utf-8"))

              files = z.namelist()

              print("ZIP contents:", files)

              target = next(
                  (
                      name for name in files
                      if Path(name).name == "PRO_OTT_BD.py"
                  ),
                  None
              )

              if target is None:
                  raise FileNotFoundError(
                      "PRO_OTT_BD.py not found inside ZIP!"
                  )

              content = z.read(target)

              Path("PRO_OTT_BD.py").write_bytes(content)

          print("Extraction successful!")
          PY

      - name: Verify Python File
        run: |
          test -s PRO_OTT_BD.py
          python -m py_compile PRO_OTT_BD.py
          echo "PRO_OTT_BD.py is ready!"
