name: TOFFE AUTO BOT

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyzipper

      - name: Debug secret (safe)
        env:
          P: ${{ secrets.BD_OTT_ZIP_PASS }}
        run: |
          if [ -z "$P" ]; then
            echo "Secret BD_OTT_ZIP_PASS is empty for this event — skipping debug."
            exit 0
          fi
          python - <<'PY'
          import os
          p = os.environ.get("P", "")
          print("secret exists:", bool(p))
          print("length:", len(p))
          print("has leading/trailing whitespace:", p != p.strip())
          PY

      - name: Extract PRO_OTT_BD.py
        env:
          BD_OTT_ZIP_PASS: ${{ secrets.BD_OTT_ZIP_PASS }}
        run: |
          python - <<'PY'
          import os, sys
          import pyzipper
          from pathlib import Path

          archive = Path("PRO_OTT_BD.zip")
          raw = os.environ.get("BD_OTT_ZIP_PASS", "")
          if not raw:
              sys.exit("BD_OTT_ZIP_PASS secret is missing/empty for this event.")
          if not archive.exists():
              sys.exit("PRO_OTT_BD.zip not found in repo root.")

          password = raw.strip().encode("utf-8")
          print(f"Password length used: {len(password)}")

          with pyzipper.AESZipFile(archive, "r") as z:
              z.setpassword(password)
              files = z.namelist()
              print("ZIP contents:", files)

              target = next(
                  (n for n in files if Path(n).name == "PRO_OTT_BD.py"),
                  None,
              )
              if target is None:
                  sys.exit("PRO_OTT_BD.py not found inside ZIP!")

              try:
                  content = z.read(target)
              except RuntimeError as e:
                  sys.exit(
                      f"Decryption failed: {e}\n"
                      "BD_OTT_ZIP_PASS does NOT match the zip password.\n"
                      "Fix: update the secret, or recreate the zip with the same password."
                  )

          Path("PRO_OTT_BD.py").write_bytes(content)
          print(f"Extracted PRO_OTT_BD.py ({len(content)} bytes)")
          PY

      - name: Verify Python File
        run: |
          test -s PRO_OTT_BD.py
          python -m py_compile PRO_OTT_BD.py
          echo "PRO_OTT_BD.py is ready!"

      - name: Run TOFFE AUTO BOT
        env:
          BD_OTT_ZIP_PASS: ${{ secrets.BD_OTT_ZIP_PASS }}
        run: |
          python PRO_OTT_BD.py
