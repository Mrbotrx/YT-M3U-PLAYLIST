name: TOFFE_PRO

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: TOFFE_PRO
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Main File
        run: |
          echo "Checking project files..."
          ls -la
          
          if [ ! -f "PRO_OTT_BD.py" ]; then
            echo "ERROR: PRO_OTT_BD.py not found in repository root!"
            exit 1
          fi

          echo "Main file found!"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Update Interval
        id: interval
        run: |
          python - <<'PY'
          import os
          import time
          from pathlib import Path

          state = Path(".last_update")

          try:
              last = float(state.read_text().strip())
          except (OSError, ValueError):
              last = 0

          due = time.time() - last >= 2700

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"due={str(due).lower()}\n")

          print("Update required:", due)
          PY

      - name: Generate Toffee Playlist
        if: steps.interval.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          python -u PRO_OTT_BD.py

      - name: Save Update Time
        if: steps.interval.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          date +%s > .last_update

      - name: Commit Playlist
        if: steps.interval.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Toffe/kb.m3u .last_update

          if ! git diff --cached --quiet; then
            git commit -m "TOFFE_PRO: Playlist Auto Update"
            git push
          else
            echo "No changes detected."
          fi

      - name: Workflow Summary
        if: always()
        run: |
          echo "## TOFFE_PRO" >> $GITHUB_STEP_SUMMARY
          echo "Output: Toffe/kb.m3u" >> $GITHUB_STEP_SUMMARY
          echo "Update Interval: 45 Minutes" >> $GITHUB_STEP_SUMMARY
          echo "Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
