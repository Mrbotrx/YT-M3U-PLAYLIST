name: TOFFE AUTO BOT

on:
  workflow_dispatch:

  schedule:
    - cron: "37 * * * *"

  push:
    branches:
      - main
    paths:
      - "PRO_OTT_BD.zip"
      - ".github/workflows/toffe-auto.yml"

permissions:
  contents: write

concurrency:
  group: toffe-auto-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      # 2. Python Setup
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyzipper requests

      # 4. Extract Encrypted ZIP
      - name: Extract PRO_OTT_BD.py
        env:
          BD_OTT_ZIP_PASS: ${{ secrets.BD_OTT_ZIP_PASS }}
        run: |
          python - <<'PY'
          import os
          import sys
          import pyzipper
          from pathlib import Path

          archive = Path("PRO_OTT_BD.zip")

          raw = os.environ.get("BD_OTT_ZIP_PASS", "")

          if not raw:
              sys.exit("ERROR: BD_OTT_ZIP_PASS secret is missing!")

          if not archive.exists():
              sys.exit("ERROR: PRO_OTT_BD.zip not found!")

          password = raw.strip().encode("utf-8")

          try:
              with pyzipper.AESZipFile(archive, "r") as z:
                  z.setpassword(password)

                  files = z.namelist()

                  target = next(
                      (n for n in files if Path(n).name == "PRO_OTT_BD.py"),
                      None
                  )

                  if target is None:
                      sys.exit("ERROR: PRO_OTT_BD.py not found inside ZIP!")

                  content = z.read(target)

              Path("PRO_OTT_BD.py").write_bytes(content)

              print("Successfully extracted PRO_OTT_BD.py")

          except Exception as e:
              sys.exit(f"ZIP Extraction Failed: {e}")
          PY

      # 5. Verify Python
      - name: Verify Python File
        run: |
          test -s PRO_OTT_BD.py
          python -m py_compile PRO_OTT_BD.py
          echo "Python file verified successfully!"

      # 6. Run Bot
      - name: Run TOFFE AUTO BOT
        env:
          BD_OTT_ZIP_PASS: ${{ secrets.BD_OTT_ZIP_PASS }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTPS_PROXY }}
        run: |
          set -o pipefail
          python -u PRO_OTT_BD.py 2>&1 | tee run.log

      # 7. Diagnose Output
      - name: Diagnose output
        if: always()
        run: |
          echo "========== OUTPUT =========="

          if [ -d Toffe ]; then
            ls -lah Toffe/
          else
            echo "Toffe folder not found!"
          fi

          echo "========== PLAYLIST =========="

          if [ -f Toffe/kb.m3u ]; then
            head -n 20 Toffe/kb.m3u

            echo "========== STATISTICS =========="
            wc -l Toffe/kb.m3u
            grep -c "^#EXTINF" Toffe/kb.m3u || true
          else
            echo "kb.m3u NOT FOUND!"
          fi

      # 8. Upload Artifact
      - name: Upload M3U artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toffee-m3u
          path: |
            Toffe/kb.m3u
            run.log
          if-no-files-found: warn
          retention-days: 7

      # 9. Auto Commit & Push
      - name: Commit and push kb.m3u
        if: success()
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          mkdir -p Toffe

          git add Toffe/kb.m3u

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update Toffe playlist [skip ci]"

          git push origin HEAD:main

      # 10. Final Status
      - name: Workflow Status
        if: always()
        run: |
          echo "TOFFE AUTO BOT workflow finished."
