name: Update IPTV Playlist

"on":
workflow_dispatch:

schedule:
- cron: "*/15 * * * *"

permissions:
contents: write

jobs:
update-playlist:
name: Generate IPTV Playlist
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install Requirements
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Extract ZIP Files
    env:
      ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
    run: |
      python - <<'PY'
      import os
      from pathlib import Path
      import pyzipper

      password = os.environ.get("ZIP_PASSWORD")
      zip_files = list(Path(".").glob("*.zip"))

      for zip_file in zip_files:
          print(f"Extracting {zip_file.name}")

          with pyzipper.AESZipFile(zip_file) as archive:
              pwd = password.encode() if password else None
              archive.extractall(".", pwd=pwd)

      print("ZIP extraction completed.")
      PY

  - name: Check Python Script
    run: |
      if [ ! -f generate_playlist.py ]; then
        echo "ERROR: generate_playlist.py not found!"
        find . -maxdepth 4 -type f
        exit 1
      fi

  - name: Generate Playlist
    run: |
      python generate_playlist.py

  - name: Verify Playlist
    run: |
      if [ ! -f IPTV/onlinetv.m3u8 ]; then
        echo "ERROR: IPTV/onlinetv.m3u8 not found!"
        exit 1
      fi

      echo "Playlist generated successfully!"
      wc -l IPTV/onlinetv.m3u8

  - name: Commit Changes
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add IPTV/onlinetv.m3u8

      if git diff --cached --quiet; then
        echo "No changes to commit."
      else
        git commit -m "Auto Update IPTV Playlist"
        git push
      fi
