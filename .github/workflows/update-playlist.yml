name: IPTV Playlist Auto Update

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

# Prevent overlapping runs from racing each other on the same push.
concurrency:
  group: iptv-playlist-update
  cancel-in-progress: false

jobs:
  playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract ZIP
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pyzipper

          password = os.environ.get("ZIP_PASSWORD") or None
          files = sorted(Path(".").glob("*.zip"))

          if not files:
              print("No ZIP files found.")

          for file in files:
              print("Extracting:", file.name)

              with pyzipper.AESZipFile(file) as archive:
                  archive.extractall(".", pwd=password.encode() if password else None)

          print("Extraction completed.")
          PY

      - name: Locate Python Script
        run: |
          if [ ! -f generate_playlist.py ]; then
            echo "ERROR: generate_playlist.py not found in repository root."
            exit 1
          fi
          echo "Found generate_playlist.py"

      - name: Generate Playlist
        run: |
          python generate_playlist.py

      - name: Check Output
        run: |
          if [ ! -s IPTV/onlinetv.m3u8 ]; then
            echo "ERROR: Playlist missing or empty!"
            exit 1
          fi

          echo "Playlist generated successfully!"
          ls -lh IPTV/onlinetv.m3u8

      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV/onlinetv.m3u8

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Auto Update IPTV Playlist"

          # Rebase onto any newer remote commits before pushing.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
