name: Update IPTV Playlist

on:
workflow_dispatch:

schedule:
- cron: "0 */3 * * *"

push:
branches:
- main

permissions:
contents: write

jobs:
update-playlist:
runs-on: ubuntu-latest

steps:
  # 1. Checkout
  - name: Checkout Repository
    uses: actions/checkout@v4

  # 2. Setup Python
  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  # 3. Install Dependencies
  - name: Install Requirements
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  # 4. Extract ZIP
  - name: Extract Python Script
    run: |
      echo "Checking ZIP archive..."

      if [ -f "generate_playlist.zip" ]; then
        unzip -o generate_playlist.zip -d extracted
      else
        echo "generate_playlist.zip not found!"
      fi

      echo "Searching Python files..."

      find . -type f -name "*.py" \
        -not -path "./.git/*"

  # 5. Find Python Script
  - name: Locate Python Script
    id: script
    shell: bash
    run: |
      SCRIPT=$(find . -type f \
        -name "generate_playlist.py" \
        -not -path "./.git/*" \
        | head -n 1)

      if [ -z "$SCRIPT" ]; then
        echo "Searching for another Python script..."

        SCRIPT=$(find ./extracted -type f \
          -name "*.py" 2>/dev/null | head -n 1)
      fi

      if [ -z "$SCRIPT" ]; then
        echo "ERROR: No Python script found inside repository or ZIP!"

        echo "ZIP CONTENTS:"
        unzip -l generate_playlist.zip || true

        exit 1
      fi

      echo "Python script found: $SCRIPT"

      echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

  # 6. Generate Playlist
  - name: Generate IPTV Playlist
    run: |
      python "${{ steps.script.outputs.script }}"

  # 7. Verify Output
  - name: Verify Playlist
    run: |
      if [ ! -s "IPTV/onlinetv.m3u8" ]; then
        echo "ERROR: Playlist missing or empty!"
        exit 1
      fi

      echo "Playlist generated successfully!"

      echo "Total lines:"
      wc -l IPTV/onlinetv.m3u8

  # 8. Commit Changes
  - name: Commit Playlist
    run: |
      git config user.name "github-actions[bot]"

      git config user.email \
        "41898282+github-actions[bot]@users.noreply.github.com"

      git add IPTV/onlinetv.m3u8

      if ! git diff --cached --quiet; then
        git commit -m "Update Working IPTV Playlist"
        git push
      else
        echo "No changes detected."
      fi
