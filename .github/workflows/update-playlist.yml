name: IPTV Playlist Auto Update

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: iptv-playlist-update
  cancel-in-progress: false

jobs:
  playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # STEP 1: Checkout Repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # STEP 2: Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # STEP 3: Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STEP 4: Extract ZIP
      - name: Extract ZIP
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import pyzipper

          password = os.environ.get("ZIP_PASSWORD") or None
          files = sorted(Path(".").glob("*.zip"))

          if not files:
              print("No ZIP files found.")

          for file in files:
              print("Extracting:", file.name)

              with pyzipper.AESZipFile(file) as archive:
                  archive.extractall(
                      ".",
                      pwd=password.encode() if password else None
                  )

          print("Extraction completed.")
          PY

      # STEP 5: Locate Python Script
      - name: Locate Python Script
        run: |
          if [ ! -f generate_playlist.py ]; then
            echo "ERROR: generate_playlist.py not found!"
            exit 1
          fi

          echo "Found generate_playlist.py"

      # STEP 6: Generate Playlist
      - name: Generate Playlist
        run: |
          python generate_playlist.py

      # STEP 7: Check Playlist
      - name: Check Output
        run: |
          if [ ! -s IPTV/onlinetv.m3u8 ]; then
            echo "ERROR: Playlist missing or empty!"
            exit 1
          fi

          echo "Playlist generated successfully!"
          ls -lh IPTV/onlinetv.m3u8

      # STEP 8: Commit Playlist
      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV/onlinetv.m3u8

          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Auto Update IPTV Playlist"

            git pull --rebase origin "${GITHUB_REF_NAME}"

            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # STEP 9: Auto Update GitHub Gist
      - name: Auto Push Playlist to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          playlist = "IPTV/onlinetv.m3u8"

          if not os.path.isfile(playlist):
              raise FileNotFoundError(playlist)

          with open(playlist, "r", encoding="utf-8") as f:
              content = f.read()

          token = os.environ.get("GIST_TOKEN")
          gist_id = os.environ.get("GIST_ID")

          if not token or not gist_id:
              raise RuntimeError("GIST_TOKEN or GIST_ID is missing!")

          url = f"https://api.github.com/gists/{gist_id}"

          payload = {
              "files": {
                  "onlinetv.m3u8": {
                      "content": content
                  }
              }
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
              },
              method="PATCH"
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  result = json.loads(response.read().decode("utf-8"))

                  print("GIST UPDATED SUCCESSFULLY!")
                  print("Gist URL:", result["html_url"])

          except urllib.error.HTTPError as error:
              print("GIST UPDATE FAILED!")
              print(error.code)
              print(error.read().decode("utf-8"))
              raise

          PY

      # STEP 10: Final Status
      - name: Update Status
        run: |
          echo "================================"
          echo "IPTV PLAYLIST UPDATE COMPLETED"
          echo "GITHUB REPOSITORY: UPDATED"
          echo "GITHUB GIST: UPDATED"
          echo "================================"
