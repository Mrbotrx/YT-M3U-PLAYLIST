name: Update Playlist

on:
  schedule:
    - cron: "0/45 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Extract Protected ZIP
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import pyzipper

          password = os.environ["ZIP_PASSWORD"]

          with pyzipper.AESZipFile(
              "generate_playlist.zip"
          ) as archive:
              archive.pwd = password.encode()
              archive.extractall(".")

          print("ZIP extracted successfully")
          PY

      - name: Generate Playlist
        env:
          ZIP_PASSWORD: ${{ secrets.ARCHIVE_PASSWORD }}
        run: |
          python generate_playlist.py

      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add playlists/ archives/

          git diff --cached --quiet || git commit -m "Automatic playlist update"

          git push
