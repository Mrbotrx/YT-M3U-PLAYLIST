name: Update IPTV Playlist

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests==2.32.5 pyzipper==0.3.6

      - name: Extract Protected ZIP
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          python - <<'PY'
          import os
          import pyzipper

          password = os.environ.get("ZIP_PASSWORD")

          if not password:
              raise RuntimeError("ZIP_PASSWORD secret is missing")

          zip_path = "generate_playlist.zip"

          if not os.path.exists(zip_path):
              raise FileNotFoundError(zip_path)

          with pyzipper.AESZipFile(zip_path, "r") as archive:
              archive.extractall(
                  path="source",
                  pwd=password.encode("utf-8")
              )

          print("ZIP extracted successfully")
          PY

      - name: Locate Python Script
        run: |
          SCRIPT=$(find source -type f -name "generate_playlist.py" -print -quit)

          if [ -z "$SCRIPT" ]; then
            echo "generate_playlist.py not found inside ZIP"
            find source -type f
            exit 1
          fi

          echo "SCRIPT=$SCRIPT" >> $GITHUB_ENV
          echo "Found script: $SCRIPT"

      - name: Generate IPTV Playlist
        env:
          ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
        run: |
          python "$SCRIPT"

      - name: Commit Playlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV/ archives/

          git diff --cached --quiet || git commit -m "Update IPTV Playlist"

          git push
