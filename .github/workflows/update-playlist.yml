name: IPTV Playlist MAKE BD

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */3 * * *"

  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  update-playlist:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Find Python Script
        id: find_script
        run: |

          echo "Searching for generate_playlist.py..."

          SCRIPT=$(find . -type f \
            -name "generate_playlist.py" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$SCRIPT" ]; then
            echo "ERROR: generate_playlist.py not found!"
            echo "Repository files:"
            find . -maxdepth 4 -type f
            exit 1
          fi

          echo "Found script: $SCRIPT"

          echo "script=$SCRIPT" >> "$GITHUB_OUTPUT"

      - name: Generate Playlist
        run: |
          python "${{ steps.find_script.outputs.script }}"

      - name: Verify Playlist
        run: |

          if [ ! -s IPTV/onlinetv.m3u8 ]; then
            echo "ERROR: Playlist not generated!"
            exit 1
          fi

          echo "Playlist generated successfully."

          echo "Total lines:"
          wc -l IPTV/onlinetv.m3u8

          head -n 10 IPTV/onlinetv.m3u8

      - name: Commit Changes
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add IPTV/onlinetv.m3u8

          if ! git diff --cached --quiet; then

            git commit -m "Update Working IPTV Playlist"

            git push

          else

            echo "No changes to commit."

          fi
