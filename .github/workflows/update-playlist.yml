name: IPTV Playlist Auto Update

on:
workflow_dispatch:
schedule:
- cron: "*/15 * * * *"

permissions:
contents: write

jobs:
playlist:
runs-on: ubuntu-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install Dependencies
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt

  - name: Extract ZIP
    env:
      ZIP_PASSWORD: ${{ secrets.ZIP_PASSWORD }}
    run: |
      python - <<'PY'
      import os
      from pathlib import Path
      import pyzipper

      password = os.environ.get("ZIP_PASSWORD")
      files = list(Path(".").glob("*.zip"))

      for file in files:
          print("Extracting:", file.name)

          with pyzipper.AESZipFile(file) as archive:
              pwd = password.encode() if password else None
              archive.extractall(".", pwd=pwd)

      print("Extraction completed.")
      PY

  - name: Locate Python Script
    run: |
      echo "Searching for generate_playlist.py"

      find . -name "generate_playlist.py" -type f

      if [ ! -f generate_playlist.py ]; then
        echo "ERROR: Script not found in repository root."
        exit 1
      fi

  - name: Generate Playlist
    run: |
      python generate_playlist.py

  - name: Check Output
    run: |
      if [ ! -s IPTV/onlinetv.m3u8 ]; then
        echo "ERROR: Playlist missing or empty!"
        exit 1
      fi

      echo "Playlist generated successfully!"
      ls -lh IPTV/onlinetv.m3u8

  - name: Commit Playlist
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      git add IPTV/onlinetv.m3u8

      if git diff --cached --quiet; then
        echo "No changes detected."
      else
        git commit -m "Auto Update IPTV Playlist"
        git push
      fi
